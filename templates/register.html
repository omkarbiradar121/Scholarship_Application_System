<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/register.css') }}"
    >
</head>

<body>

    <div class="register-card">

        <div class="icon">🎓</div>

        <h1>Student Registration</h1>

        <p>Create your account to apply for scholarships</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form id="register-form" method="POST" action="{{ url_for('auth.register') }}">

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="student_id">Student ID</label>
                <input
                    type="text"
                    id="student_id"
                    name="student_id"
                    required
                >
            </div>

            <button type="submit" id="register-btn" class="btn-register">
                Register
            </button>

        </form>

        <div class="footer">
            Already have an account?
            <a href="/login" id="login-link">Login here</a>
        </div>

    </div>

</body>
</html>
